        function stopCode(stop) {
            const m = String(stop?.name || '').match(/^([A-Z]{2}\d{3})\s*-/i);
            return m ? m[1].toUpperCase() : '';
        }

        function haversineKm(a, b) {
            const R = 6371; // Erdradius in km
            const p = Math.PI / 180;
            const dLat = (b.lat - a.lat) * p;
            const dLon = (b.lon - a.lon) * p;
            const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * p) * Math.cos(b.lat * p) * Math.sin(dLon / 2) ** 2;
            return 2 * R * Math.asin(Math.sqrt(x));
        }

        const COMFORT_SURCHARGE = 2.00;

        // Zwischenzonen aus Geometrie ermitteln
        function zonesBetween(startStop, endStop, routeGeometry) {
            const found = new Set();
            if (!routeGeometry || !Array.isArray(routeGeometry.coordinates)) return found;
            const coords = routeGeometry.coordinates;
            const step = Math.max(1, Math.floor(coords.length / 30));
            for (let i = step; i < coords.length - step; i += step) {
                const pt = { lat: coords[i][1], lon: coords[i][0] };
                let best = null, bestD = Infinity;
                // Hier müsstest du die Stoppkoordinaten einfügen, um die Zonen zu finden.
                for (const s of TARIFF_ZONES) {
                    const d = haversineKm(pt, { lat: s.lat, lon: s.lon });
                    if (d < bestD) { bestD = d; best = s; }
                }
                if (best && bestD < 1.5) {
                    const z = STOP_ZONE[stopCode(best)];
                    if (z) found.add(z);
                }
            }
            return found;
        }

        function getRouteZoneSequence(startStop, endStop, routeGeometry = null) {
            const sCode = stopCode(startStop);
            const eCode = stopCode(endStop);
            const key = sCode + '|' + eCode;

            if (VERIFIED_ROUTES.has(key)) {
                const v = VERIFIED_ROUTES.get(key);
                return { zones: v.zones, sequence: v.sequence, verified: true };
            }

            const zStart = STOP_ZONE[sCode];
            const zEnd = STOP_ZONE[eCode];

            if (!zStart || !zEnd) {
                return { zones: 0, sequence: [], verified: false };
            }

            const between = zonesBetween(startStop, endStop, routeGeometry);

            const seq = [zStart];
            for (const z of between) {
                if (z !== seq[seq.length - 1]) seq.push(z);
            }
            if (zEnd !== seq[seq.length - 1]) seq.push(zEnd);

            return { zones: seq.length, sequence: seq, verified: false };
        }
